<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .bubble{
            width: 11px;
            height: 12px;
            position: fixed;
            top: 0;
        }
        @keyframes fall{
            to{
                transform: translateY(100vh) rotateY(860deg);
            }
        }
    </style>
</head>
<body>
    <!-- <div class="bubble"></div> -->
    <script>
        for (i=0;i<30;i+=1){
            let bubble=document.createElement("div");
            bubble.classList.add("bubble");
            document.body.appendChild(bubble);
            bubble.style.left=Math.random()*100+"%";
            bubble.style.backgroundColor=`rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255})`;
            bubble.style.borderRadius=`${Math.random()*100}%`;
            let x=Math.random()*3;
            bubble.style.animation=`fall ${x}s linear`;
            setTimeout(()=>{
                bubble.remove();
            },x*1000);
        }
    </script>
</body>
</html>
